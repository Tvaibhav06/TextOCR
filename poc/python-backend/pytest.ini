[pytest]
# Register custom markers to avoid PytestUnknownMarkWarning
markers =
    slow: marks tests as slow (skip with: pytest -m "not slow")
    live: marks tests that load real ML models (skip with: pytest -m "not live")

# Default test discovery path
testpaths = tests

# Disable globally-installed third-party pytest plugins that are incompatible
# with Python 3.12 (langsmith uses pydantic v1 ForwardRef which crashes on 3.12).
addopts = -p no:langsmith
